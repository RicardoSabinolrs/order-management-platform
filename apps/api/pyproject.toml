[project]
name = "order-management-api"
version = "0.1.0"
description = "Order Management Platform API - DDD + arquitetura hexagonal"
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"

dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
    "sqlalchemy[asyncio]>=2.0.44",
    "asyncpg>=0.30",
    "alembic>=1.17",
    "structlog>=25.4",
    "prometheus-client>=0.24",
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.2.1",
]

[project.optional-dependencies]
dev = [
    "asgi-lifespan>=2.1",
    "pytest>=8.4",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.0",
    "httpx>=0.28",
    "ruff>=0.15",
    "mypy>=1.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Layout em camadas: api/, domain/, infra/ e security/ sao pacotes de topo
# servidos a partir de src/.
sources = ["src"]
only-include = ["src"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RUF",       # ruff
    "ANN",       # anotacoes de tipo
    "ASYNC",     # armadilhas de async
    "TID",       # imports
    "PL",        # pylint
    "S",         # bandit
    "BLE",       # excecoes genericas
]
ignore = [
    "ANN401",    # Any explicito e permitido em pontos de fronteira
]

[tool.ruff.lint.per-file-ignores]
# S105/S106: literais como "bearer" e chaves de teste nao sao segredos reais.
"tests/**" = ["ANN", "PLR2004", "S101", "S105", "S106", "TID251"]
"migrations/**" = ["ANN", "E501", "I001", "TID251"]
# O seed ajusta o sys.path antes de importar a aplicacao.
"scripts/**" = ["E402", "T201", "TID251"]
# api/, infra/ e security/ SAO os adapters: e ali que o framework pode entrar.
# A barreira TID251 protege apenas domain/.
# Construtores de agregado recebem um argumento por campo ao serem
# reidratados do banco: quebra-los em objetos so pioraria a leitura.
"src/domain/model/**" = ["PLR0913"]
"src/api/**" = ["TID251"]
"src/infra/**" = ["TID251"]
"src/security/**" = ["TID251"]
"src/main.py" = ["TID251"]

[tool.ruff.lint.isort]
known-first-party = ["api", "domain", "infra", "security"]

[tool.ruff.lint.pylint]
# problem_response() em api/errors.py monta o corpo RFC 9457: sao 6 campos do
# formato mais os headers da resposta, todos nomeados.
max-args = 7

# Barreira arquitetural: domain/ nao conhece framework web nem ORM.
# Os adapters estao liberados via per-file-ignores acima.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fastapi".msg = "domain/ nao pode importar FastAPI (ver docs/architecture.md)."
"sqlalchemy".msg = "domain/ nao pode importar SQLAlchemy (ver docs/architecture.md)."
"starlette".msg = "domain/ nao pode importar Starlette (ver docs/architecture.md)."

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
strict = true
warn_unreachable = true
warn_return_any = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
# Um loop so para a sessao inteira: o engine dos testes de integracao nasce
# numa fixture de sessao, e conexao asyncpg nao atravessa loops. Com loop por
# teste, o pool entregaria a segunda requisicao a um loop que ja fechou.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: exige infraestrutura externa (postgres)",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
