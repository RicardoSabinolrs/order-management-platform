# Stack local completa: aplicacao + observabilidade.
# O objetivo e que o que o desenvolvedor ve aqui seja o mesmo que o SRE ve no
# cluster - mesmas metricas, mesmos logs, mesmos paineis.
name: order-management

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-order_management}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-order_management}
      POSTGRES_DB: ${POSTGRES_DB:-order_management}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-order_management}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # Mesma tag usada por `make docker-build-api` e pelo Minikube: a imagem e
    # construida uma vez e reaproveitada.
    image: order-management-api:${IMAGE_TAG:-local}
    build:
      context: ./apps/api
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_LOG_FORMAT: json
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-order_management}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-order_management}
      POSTGRES_DB: ${POSTGRES_DB:-order_management}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      logging: promtail

  web:
    image: order-management-web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:8080"
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v3.7.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infra/observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.5.9
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./infra/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.5.9
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./infra/observability/loki/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/observability/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  postgres-data:
  prometheus-data:
  loki-data:
  grafana-data:
