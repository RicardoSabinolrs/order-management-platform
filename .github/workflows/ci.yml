name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um PR que recebe varios pushes cancela as execucoes antigas.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (lint, tipos, testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: order_management
          POSTGRES_PASSWORD: order_management
          POSTGRES_DB: order_management
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U order_management"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - run: uv sync --all-extras --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Formatacao
        run: uv run ruff format --check .

      - name: Tipos
        run: uv run mypy src

      - name: Migrations
        run: uv run alembic upgrade head
        env:
          POSTGRES_HOST: localhost

      - name: Testes
        run: uv run pytest --cov --cov-report=term-missing
        env:
          POSTGRES_HOST: localhost
          APP_ENV: test

  web:
    name: Web (lint, tipos, testes, build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Testes
        run: pnpm test

      - name: Build
        run: pnpm build

  infra:
    name: Infra (Helm, Terraform)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4

      - name: Lint do chart
        run: helm lint infra/helm/order-management --set image.tag=ci

      - name: Renderiza os manifestos de cada ambiente
        run: |
          for env in staging production; do
            helm template order-management infra/helm/order-management \
              --values infra/helm/order-management/values.yaml \
              --values "infra/helm/order-management/values-$env.yaml" \
              --set image.tag=ci > /dev/null
          done

      - uses: hashicorp/setup-terraform@v3

      - name: Formatacao do Terraform
        run: terraform fmt -check -recursive infra/terraform

      - name: Validacao dos modulos
        run: |
          for dir in infra/terraform/environments/*; do
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
          done

  images:
    name: Build das imagens
    runs-on: ubuntu-latest
    needs: [api, web]

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Imagem da API
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Imagem do Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
