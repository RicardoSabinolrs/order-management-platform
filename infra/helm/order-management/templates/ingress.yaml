{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "order-management.fullname" . }}
  labels:
    {{- include "order-management.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # A API vem primeiro: o prefixo mais especifico precisa ganhar do "/".
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "order-management.fullname" . }}-api
                port:
                  number: 80
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: {{ include "order-management.fullname" . }}-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "order-management.fullname" . }}-web
                port:
                  number: 80
{{- end }}
