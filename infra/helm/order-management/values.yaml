# Valores padrao. Cada ambiente sobrescreve o necessario em values-<env>.yaml,
# passado ao helm junto com este arquivo.

nameOverride: ""
fullnameOverride: ""

image:
  registry: ghcr.io
  repository: sabino-labs/order-management
  # A tag e injetada pelo pipeline (digest do commit). Nunca use "latest".
  tag: ""
  pullPolicy: IfNotPresent

api:
  replicaCount: 2
  containerPort: 8000

  env:
    APP_ENV: production
    APP_LOG_FORMAT: json
    APP_LOG_LEVEL: INFO

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  probes:
    liveness:
      path: /health/live
      initialDelaySeconds: 10
      periodSeconds: 20
    readiness:
      path: /health/ready
      initialDelaySeconds: 5
      periodSeconds: 10

web:
  replicaCount: 2
  containerPort: 8080
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

# Migrations rodam como hook pre-upgrade: o trafego so chega ao codigo novo
# depois que o schema esta pronto.
migrations:
  enabled: true
  backoffLimit: 2

database:
  host: ""
  port: 5432
  name: order_management
  user: order_management
  # A senha NUNCA vai em values. Vem de um Secret existente no cluster,
  # normalmente criado por External Secrets a partir do Vault/Secrets Manager.
  existingSecret: order-management-db
  existingSecretPasswordKey: password

ingress:
  enabled: true
  className: nginx
  host: orders.example.com
  tls:
    enabled: true
    secretName: order-management-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

serviceMonitor:
  enabled: true
  interval: 15s
  path: /metrics

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
