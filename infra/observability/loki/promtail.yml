server:
  http_listen_port: 9080
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_logging"]
        regex: "promtail"
        action: keep
    pipeline_stages:
      # A API loga JSON: promover os campos a labels torna o log pesquisavel
      # por nivel e por id de correlacao no Grafana.
      - json:
          expressions:
            level: level
            event: event
            request_id: request_id
      - labels:
          level:
          request_id:
