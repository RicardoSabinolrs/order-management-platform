# Postgres de desenvolvimento dentro do cluster.
#
# StatefulSet de uma replica com PVC. Para producao isto e substituido pelo RDS
# provisionado em infra/terraform - banco de estado critico nao roda no mesmo
# cluster que a aplicacao.
apiVersion: v1
kind: Secret
metadata:
  name: order-management-db
type: Opaque
stringData:
  # Credencial de desenvolvimento. Nos ambientes reais este Secret e criado
  # pelo External Secrets a partir do Secrets Manager.
  password: order_management
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/name: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: order_management
            - name: POSTGRES_DB
              value: order_management
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-management-db
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "order_management"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
